<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House Of Heaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --cream: #f0ece4;
      --dark:  #0e0c0a;
      --accent:#b8a88a;
      --muted: #8a8278;
    }
html,
body{
  margin:0;
  padding:0;

  overflow-x:hidden;
  overflow-y:auto;

  scrollbar-width:none;
  -ms-overflow-style:none;
}

/* Chrome Safari Edge */

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}
    /* GRAIN */
    .grain {
      position:fixed; inset:0;
      pointer-events:none; opacity:.04; z-index:9999;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* CUSTOM CURSOR */
    #cursor {
      position:fixed;
      width:8px; height:8px;
      border-radius:50%;
      background:var(--accent);
      pointer-events:none;
      z-index:10000;
      transform:translate(-50%,-50%);
      mix-blend-mode:multiply;
    }

    /* HERO */
    #heroSection {
      position:relative;
      height:300vh;
    }

    #heroSticky {
      position:sticky;
      top:0;
      height:100vh;
      overflow:visible;
    }

    /* ─── RESPONSIVE BASE ─── */
    /* HERO TEXT */
    #heroText {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      z-index:50;
      width:100%;
      padding:0 20px;
      pointer-events:none;
    }

    .eyebrow {
    
      font-size:clamp(8px,1.8vw,11px);
      font-weight:300;
      letter-spacing:clamp(5px,1.2vw,10px);
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:clamp(12px,2.5vw,22px);
      opacity:0;
      animation:fadeUp 1s 0.5s forwards;
    }

    .hero-title {
      
      font-size:clamp(1.8rem,6.5vw,9rem);
      font-weight:300;
      line-height:0.88;
      letter-spacing:-0.02em;
      color:transparent;
      -webkit-text-stroke:clamp(0.35px,0.08vw,0.8px) #8a8278;
      opacity:0;
      animation:fadeUp 1.3s 0.75s forwards;
    }

    .hero-title em { font-style:italic; font-weight:300; }

    .hero-sub {
      font-family:'Outfit',sans-serif;
      font-size:clamp(7px,1.6vw,11px);
      font-weight:200;
      letter-spacing:clamp(4px,1vw,8px);
      text-transform:uppercase;
      color:var(--muted);
      margin-top:clamp(12px,2.2vw,24px);
      opacity:0;
      animation:fadeUp 1s 1.1s forwards;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* CORNER TAGS */
    #yearTag {
      position:absolute;
      top:clamp(12px,3vw,40px);
      left:clamp(12px,3vw,40px);
      z-index:200;
      opacity:0;
      animation:fadeUp 1s 1.3s forwards;
    }

    #indexTag {
      position:absolute;
      top:clamp(12px,3vw,40px);
      right:clamp(12px,3vw,40px);
      z-index:200;
      opacity:0;
      animation:fadeUp 1s 1.4s forwards;
    }

    #yearTag span, #indexTag span {
      font-family:'Outfit',sans-serif;
      font-size:clamp(7px,1.2vw,9px);
      font-weight:300;
      letter-spacing:clamp(2px,0.8vw,4px);
      text-transform:uppercase;
      color:var(--muted);
      white-space:nowrap;
    }

    /* SCROLL HINT */
    #scrollHint {
      position:absolute;
      bottom:clamp(30px,5vw,50px);
      left:50%;
      transform:translateX(-50%);
      z-index:200;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      opacity:0;
      animation:fadeUp 1s 1.7s forwards;
    }

    .scroll-line {
      width:1px;
      height:clamp(30px,6vw,44px);
      background:linear-gradient(to bottom,transparent,var(--accent));
      animation:scrollPulse 2s 2.2s infinite ease-in-out;
    }

    @keyframes scrollPulse {
      0%,100% { opacity:0.3; transform:scaleY(1); }
      50%      { opacity:1;   transform:scaleY(1.2); }
    }

    .scroll-text {
      font-family:'Outfit',sans-serif;
      font-size:clamp(7px,1.2vw,9px);
      font-weight:300;
      letter-spacing:clamp(3px,0.8vw,5px);
      text-transform:uppercase;
      color:var(--accent);
    }

    /* IMAGE STRIP */
    #imageStrip {
      position:absolute;
      bottom:0; left:0; right:0;
      padding:0 clamp(12px,3vw,44px) clamp(20px,4vw,48px);
      z-index:30;
    }

    #stripInner {
      display:grid;
      align-items:end;
      gap:clamp(8px,1.5vw,16px);
    }

    /* ─── TABLET (641px - 1024px) ─── */
    @media (max-width:1024px) {
      #heroSection { height:250vh; }
      #stripInner { grid-template-columns:1fr 1.3fr 1fr; gap:clamp(10px,2vw,14px); }
      .sc1  { height:clamp(110px,12vw,160px); }
      .sc2  { height:clamp(90px,10vw,130px); }
      .sc3  { height:clamp(110px,12vw,150px); }
      .sc6a { height:clamp(120px,13vw,200px); }
      .sc7  { height:clamp(100px,11vw,155px); }
      #centerPlaceholder { height:clamp(200px,22vw,300px); }
      .col-hide-tablet { display:none !important; }
      #scrollHint { display:none !important; }
    }

    /* ─── MOBILE LANDSCAPE (641px - 900px) ─── */
    @media (max-width:900px) {
      #heroSection { height:240vh; }
      #heroText { top:48%; }
    }

    /* ─── SMALL TABLET (641px - 768px) ─── */
    @media (max-width:768px) {
      #heroSection { height:230vh; }
      #stripInner { grid-template-columns:1fr 1.2fr 1fr; }
    }

    /* ─── MOBILE (max-width: 640px) ─── */
    @media (max-width:640px) {
      #heroSection { height:200vh; }
      #heroSticky { height:100vh; }
      #heroText { top:45%; padding:0 16px; }
      
      #imageStrip { padding:0 clamp(10px,2.5vw,16px) clamp(16px,3.5vw,24px); }
      #stripInner { 
        grid-template-columns:1fr 1fr;
        gap:clamp(8px,2vw,12px);
      }

      .sc1  { height:clamp(95px,20vw,115px); }
      .sc2  { display:none; }
      .sc3  { height:clamp(110px,22vw,140px); }
      .sc6a { height:clamp(120px,24vw,160px); }
      .sc7  { height:clamp(100px,21vw,130px); }
      #centerPlaceholder { height:clamp(160px,32vw,220px); }
      .col-hide-tablet { display:none !important; }
      #scrollHint { display:none !important; }
      #yearTag, #indexTag { top:clamp(14px,3.5vw,20px); }
    }

    /* ─── SMALL MOBILE (max-width: 480px) ─── */
    @media (max-width:480px) {
      #heroSection { height:190vh; }
      #heroText { top:43%; }
      #imageStrip { padding:0 12px clamp(12px,3vw,20px); }
      #stripInner { gap:clamp(7px,2vw,10px); }
      .sc1  { height:clamp(85px,22vw,100px); }
      .sc3  { height:clamp(100px,24vw,120px); }
      .sc6a { height:clamp(105px,25vw,140px); }
      .sc7  { height:clamp(90px,23vw,110px); }
      #centerPlaceholder { height:clamp(140px,35vw,190px); }
    }

    /* ─── TINY MOBILE (max-width: 375px) ─── */
    @media (max-width:375px) {
      #heroSection { height:180vh; }
      #heroText { top:41%; padding:0 12px; }
      .hero-title { font-size:clamp(1.5rem,5vw,2.5rem); }
      .eyebrow { font-size:clamp(7px,1.5vw,8px); }
      .hero-sub { font-size:clamp(6px,1.3vw,7px); }
    }

    /* ─── DESKTOP (1025px and up) ─── */
    @media (min-width:1025px) {
      #heroSection { height:300vh; }
      #stripInner { 
        grid-template-columns:1.1fr 0.85fr 1.6fr 0.85fr 1.1fr;
        gap:16px;
      }
      .sc1  { height:220px; }
      .sc2  { height:155px; }
      .sc3  { height:190px; }
      .sc6a { height:260px; }
      .sc7  { height:200px; }
      #centerPlaceholder { height:360px; }
    }

    .strip-col {
      display:flex;
      flex-direction:column;
      gap:inherit;
    }

    .img-clip {
      overflow:hidden;
      border-radius:clamp(8px,1.5vw,16px);
      width:100%;
      flex-shrink:0;
      position:relative;
      clip-path:inset(100% 0 0 0 round 14px);
    }

    .img-clip img {
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      filter:brightness(0.9) saturate(0.88);
      transform:scale(1.08);
      transition:filter 0.8s ease;
    }

    .img-clip:hover img {
      filter:brightness(0.96) saturate(1.0);
    }

    .corner-num {
      position:absolute;
      top:clamp(6px,1.5vw,12px);
      right:clamp(6px,1.5vw,12px);
      font-family:'Outfit',sans-serif;
      font-size:clamp(6px,1vw,9px);
      font-weight:300;
      letter-spacing:clamp(1px,0.4vw,2px);
      color:rgba(255,255,255,0.4);
      z-index:3;
    }

    /* CENTER PLACEHOLDER */
    #centerWrap { position:relative; }

    #centerPlaceholder {
      visibility:hidden;
      width:100%;
      border-radius:14px;
    }

    /* FIXED CARD */
    #centerImage {
      position:fixed;
      border-radius:14px;
      overflow:hidden;
      z-index:100;
      will-change:transform, border-radius;
      transform-origin:center center;
      opacity:0;
    }

    #centerImage img {
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      will-change:transform;
    }

    .card-vignette {
      position:absolute; inset:0;
      background:radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.30) 100%);
      z-index:2;
      pointer-events:none;
    }

    .card-label {
      position:absolute;
      bottom:clamp(12px,2vw,20px);
      left:clamp(12px,2vw,20px);
      z-index:3;
      display:flex;
      align-items:center;
      gap:clamp(6px,1vw,10px);
    }

    .card-label-dot {
      width:clamp(4px,0.5vw,6px);
      height:clamp(4px,0.5vw,6px);
      border-radius:50%;
      background:rgba(255,255,255,0.6);
      flex-shrink:0;
    }

    .card-label-text {
      font-family:'Outfit',sans-serif;
      font-size:clamp(7px,1vw,10px);
      font-weight:300;
      letter-spacing:clamp(2px,0.6vw,4px);
      text-transform:uppercase;
      color:rgba(255,255,255,0.6);
    }

    /* TICKER */
    #ticker {
      position:absolute;
      bottom:0; left:0; right:0;
      height:clamp(28px,4vw,40px);
      overflow:hidden;
      z-index:40;
      border-top:0.5px solid rgba(0,0,0,0.07);
      display:flex;
      align-items:center;
    }

    .ticker-track {
      display:flex;
      white-space:nowrap;
      animation:tickerScroll 26s linear infinite;
    }

    .ticker-item {
      font-family:'Outfit',sans-serif;
      font-size:clamp(7px,1vw,9px);
      font-weight:300;
      letter-spacing:clamp(3px,0.8vw,6px);
      text-transform:uppercase;
      color:var(--accent);
      padding:0 clamp(20px,3vw,40px);
    }

    .ticker-sep { font-size:clamp(7px,1vw,10px); color:var(--accent); opacity:0.4; }

    @keyframes tickerScroll {
      from { transform:translateX(0); }
      to   { transform:translateX(-50%); }
    }

    /* NEXT SECTION */
    #nextSection {
      position:relative; z-index:10;
      height:100vh;
      background:var(--dark);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:clamp(20px,5vw,40px);
    }

    #nextInner { 
      text-align:center;
      position:relative;
      z-index:2;
      max-width:90vw;
    }

    #weddingTag {
      font-family:'Outfit',sans-serif;
      font-size:clamp(8px,1.5vw,11px);
      font-weight:300;
      letter-spacing:clamp(8px,1.2vw,14px);
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:clamp(18px,3vw,32px);
      opacity:0;
    }

    #weddingTitle {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(2rem,6vw,90px);
      font-weight:300;
      line-height:0.9;
      color:transparent;
      -webkit-text-stroke:clamp(0.3px,0.08vw,0.6px) rgba(255,255,255,0.65);
      letter-spacing:-0.02em;
      opacity:0;
      transform:translateY(40px);
    }

    #weddingTitle em {
      font-style:italic;
      -webkit-text-stroke:clamp(0.2px,0.06vw,0.5px) rgba(255,255,255,0.4);
    }

    #weddingLine {
      position:absolute;
      bottom:0; left:50%;
      transform:translateX(-50%);
      width:1px; height:0;
      background:rgba(255,255,255,0.1);
    }

    .next-glow {
      position:absolute;
      border-radius:50%;
      background:radial-gradient(circle,rgba(184,168,138,0.07),transparent 70%);
      pointer-events:none;
      width:clamp(400px,60vw,900px);
      height:clamp(400px,60vw,900px);
    }
  </style>
</head>

<body>
<div class="grain"></div>
<div id="cursor"></div>

<!-- HERO -->
<section id="heroSection">
  <div id="heroSticky">

   

    <div id="heroText">
      <p class="eyebrow">Photography Brand</p>
      <h1 class="hero-title">Ho<em>use</em><br><em>of Heaven</em></h1>
     
    </div>

    <div id="scrollHint">
      <div class="scroll-line"></div>
      <span class="scroll-text">Scroll</span>
    </div>

    <div id="imageStrip">
      <div id="stripInner">

        <div class="strip-col" id="col1">
          <div class="img-clip sc1">
            <img src="./images/portrait1.png" alt="Portrait 1"/>
            <span class="corner-num">01</span>
          </div>
          <div class="img-clip sc2">
            <img src="./images/portrait2.png" alt="Portrait 2"/>
          </div>
        </div>

        <div class="strip-col col-hide-tablet" id="col2">
          <div class="img-clip sc3">
            <img src="./images/seeing1.png" alt="Hero"/>
            <span class="corner-num">02</span>
          </div>
        </div>

        <div id="centerWrap">
          <div id="centerPlaceholder"></div>
        </div>

        <div class="strip-col col-hide-tablet" id="col4">
          <div class="img-clip sc6a">
            <img src="./images/new.png" alt="Portrait 3"/>
            <span class="corner-num">03</span>
          </div>
        </div>

        <div class="strip-col" id="col5">
          <div class="img-clip sc7">
            <img src="./images/portrait3.png" alt="Portrait 4"/>
            <span class="corner-num">04</span>
          </div>
          <div class="img-clip sc2 col-hide-tablet">
            <img src="./images/new1.png" alt="Portrait 5"/>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>

<!-- FIXED EXPANDING CARD -->
<div id="centerImage">
  <img id="mainImage" src="./images/heronew.png" alt="Featured work"/>
  <div class="card-vignette"></div>
  <div class="card-label">
    <div class="card-label-dot"></div>
    <span class="card-label-text"></span>
  </div>
</div>




<script>
gsap.registerPlugin(ScrollTrigger);

/* ── CURSOR ── */
const cursorEl = document.getElementById('cursor');
let cx = 0, cy = 0, mx = 0, my = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function animCursor() {
  cx += (mx - cx) * 0.13;
  cy += (my - cy) * 0.13;
  cursorEl.style.left = cx + 'px';
  cursorEl.style.top  = cy + 'px';
  requestAnimationFrame(animCursor);
})();

document.querySelectorAll('.img-clip, #centerImage').forEach(el => {
  el.addEventListener('mouseenter', () => gsap.to(cursorEl, { width:26, height:26, opacity:0.65, duration:0.3, ease:'power2.out' }));
  el.addEventListener('mouseleave', () => gsap.to(cursorEl, { width:8,  height:8,  opacity:1,   duration:0.3, ease:'power2.out' }));
});

/* ── LOAD ENTRANCE ── */
window.addEventListener('load', () => {
  const clips = document.querySelectorAll('.img-clip');
  clips.forEach((el, i) => {
    gsap.to(el, {
      clipPath: 'inset(0% 0 0 0 round 14px)',
      duration: 1.1,
      delay: 1.1 + i * 0.09,
      ease: 'expo.out'
    });
    gsap.to(el.querySelector('img'), {
      scale: 1,
      duration: 1.4,
      delay: 1.1 + i * 0.09,
      ease: 'expo.out'
    });
  });

  gsap.fromTo('#centerImage',
    { opacity: 0, scale: 0.86, y: 20 },
    { opacity: 1, scale: 1,    y: 0,
      duration: 1.4, delay: 1.05, ease: 'expo.out' }
  );

  requestAnimationFrame(() => requestAnimationFrame(buildTimeline));
});

/* ── PLACE CARD OVER PLACEHOLDER ── */
function placeCard() {
  const ph   = document.getElementById('centerPlaceholder');
  const card = document.getElementById('centerImage');
  const r    = ph.getBoundingClientRect();
  gsap.set(card, {
    top: r.top, left: r.left,
    width: r.width, height: r.height,
    x: 0, y: 0, scale: 1,
    borderRadius: 14
  });
}

/* ── SCROLL EXPAND TIMELINE ── */
function buildTimeline() {
  ScrollTrigger.getAll().forEach(t => t.kill());
  placeCard();

  const ph  = document.getElementById('centerPlaceholder');
  const r   = ph.getBoundingClientRect();
  const vw  = window.innerWidth;
  const vh  = window.innerHeight;

  const targetScale = Math.max(vw / r.width, vh / r.height) * 1.003;
  const moveX = vw / 2 - (r.left + r.width  / 2);
  const moveY = vh / 2 - (r.top  + r.height / 2);

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#heroSection',
      start:   'top top',
      end:     'bottom bottom',
      scrub:   1.8,
      onLeave:     () => gsap.set('#centerImage', { display:'none' }),
      onEnterBack: () => gsap.set('#centerImage', { display:'block' })
    }
  });

  /* Phase 1 — UI sweeps away */
  tl.to('#heroText',    { y:-75, opacity:0, ease:'power2.in' },  0);
  tl.to('#yearTag',     { y:-24, opacity:0, ease:'power2.in' },  0);
  tl.to('#indexTag',    { y:-24, opacity:0, ease:'power2.in' },  0);
  tl.to('#scrollHint',  {        opacity:0, ease:'power2.in' },  0);
  tl.to('.card-label',  {        opacity:0, ease:'power2.in' },  0.03);

  /* columns fly outward */
  tl.to('#col1', { x:-240, opacity:0, ease:'power3.in' }, 0.03);
  tl.to('#col2', { x:-120, opacity:0, ease:'power3.in' }, 0.06);
  tl.to('#col4', { x: 120, opacity:0, ease:'power3.in' }, 0.06);
  tl.to('#col5', { x: 240, opacity:0, ease:'power3.in' }, 0.03);

  /* Phase 2 — card expands to fill screen perfectly */
  tl.to('#centerImage', {
    scale:        targetScale,
    x:            moveX,
    y:            moveY,
    borderRadius: 0,
    ease:         'expo.inOut'
  }, 0.18);

  /* inner image subtle parallax zoom */
  tl.to('#mainImage', {
    scale:    1.09,
    ease:     'expo.inOut'
  }, 0.18);
}

/* ── RESIZE ── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    gsap.set(['#heroText','#yearTag','#indexTag','#scrollHint',
              '#col1','#col2','#col4','#col5'], { clearProps:'all' });
    buildTimeline();
  }, 140);
});

/* ── NEXT SECTION ── */
ScrollTrigger.create({
  trigger: '#nextSection',
  start:   'top 78%',
  onEnter: () => {
    gsap.to('#weddingTitle', { opacity:1, y:0, duration:1.4, ease:'expo.out' });
    gsap.to('#weddingTag',   { opacity:1, letterSpacing:'18px', duration:1.8, ease:'expo.out', delay:0.2 });
    gsap.to('#weddingLine',  { height:'40%', duration:1.8, ease:'expo.out', delay:0.4 });
  }
});
</script>
</body>
</html>
