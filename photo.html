<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selected Work — Showcase</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --dark:   #0a0808;
      --cream:  #f0ece4;
      --accent: #b8a88a;
      --muted:  #8a8278;
      --gold:   #c9a84c;
    }

    html, body {
      background: var(--dark);
      color: var(--cream);
      width:100%;
 

    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }


    
    /* ── GRAIN ───────────────────────────────────── */
    .grain {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999; opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── CURSOR ──────────────────────────────────── */
    #cursor {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%,-50%);
      mix-blend-mode: difference;
      transition: width .3s, height .3s, opacity .3s;
    }
    #cursor.big { width: 48px; height: 48px; opacity: .5; }

    /* ── SECTION WRAPPER ─────────────────────────── */
    #showcase {
      position: relative;
      background: var(--dark);
      padding: 0;
      overflow: hidden;
    }

    /* ── SECTION HEAD ────────────────────────────── */
    .sh-head {
      position: relative;
      z-index: 10;
      padding: clamp(70px,10vw,130px) clamp(24px,6vw,80px) clamp(50px,7vw,90px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sh-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7px,1vw,9px);
      font-weight: 300;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
    }

    .sh-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(44px,7vw,96px);
      font-weight: 300;
      font-style: italic;
      line-height: .88;
      letter-spacing: -.02em;
      color: transparent;
      -webkit-text-stroke: .6px rgba(240,236,228,.55);
      opacity: 0;
      transform: translateY(30px);
    }

    .sh-count {
      
      font-size: clamp(7px,1vw,9px);
      font-weight: 200;
      letter-spacing: .3em;
      color: var(--muted);
      opacity: 0;
    }

    /* ── MARQUEE DIVIDER ─────────────────────────── */
    .marquee-wrap {
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: clamp(10px,1.5vw,16px) 0;
      opacity: 0;
    }
    .marquee-track {
      display: flex;
      white-space: nowrap;
      animation: marqueeRun 22s linear infinite;
    }
    .marquee-item {
      font-size: clamp(7px,.9vw,9px);
      font-weight: 300;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 clamp(18px,3vw,38px);
    }
    .marquee-dot { color: var(--gold); opacity: .5; }
    @keyframes marqueeRun {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ══════════════════════════════════════════════
       MAIN SHOWCASE PIECES
    ══════════════════════════════════════════════ */

    /* ── PIECE A: FULL-WIDTH PARALLAX REVEAL ─────── */
    .piece-a {
      position: relative;
    
      overflow: hidden;
    }
    .piece-a .pa-img {
      position: absolute;
      inset: -15%;
      width: 100%; ;
      will-change: transform;
    }
    .piece-a .pa-img img {
      width: 100%; 
      object-fit: cover;
      display: block;
      filter: brightness(.65) saturate(.45) contrast(1.12);
      transform: scale(1.12);
      transition: filter 1.2s ease;
    }
    .piece-a:hover .pa-img img { filter: brightness(.78) saturate(.75) contrast(1.18); }

    /* clip-wipe reveal */
    .piece-a .pa-clip {
      position: absolute; inset: 0;
      clip-path: inset(100% 0 0 0);
      will-change: clip-path;
    }

    /* text overlay */
    .piece-a .pa-text {
      position: absolute;
      bottom: clamp(40px,6vw,80px);
      left: clamp(24px,6vw,80px);
      z-index: 5;
      opacity: 0;
    }
    .piece-a .pa-text .pt-cat {
      font-size: clamp(7px,.9vw,9px);
      font-weight: 300;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .piece-a .pa-text .pt-cat::before {
      content: '';
      width: 28px; height: 1px;
      background: var(--gold); opacity: .6;
    }
    .piece-a .pa-text .pt-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px,5vw,72px);
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
      line-height: .9;
      letter-spacing: -.01em;
    }
    .piece-a .pa-year {
      position: absolute;
      top: clamp(24px,3vw,40px);
      right: clamp(24px,4vw,60px);
      font-size: clamp(7px,.9vw,9px);
      font-weight: 200;
      letter-spacing: .3em;
      color: rgba(255,255,255,.25);
      z-index: 5;
      opacity: 0;
    }

    /* ── PIECE B: SPLIT — TALL LEFT + STACKED RIGHT ── */
    .piece-b {
      display: flex;
      height: clamp(520px,80vh,900px);
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .pb-left {
      flex: 0 0 55%;
      position: relative;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
    }
    .pb-left img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.08);
      transition: filter 1s ease, transform 1s ease;
    }
    .pb-left:hover img {
      transform: scale(1.02);
    }
    .pb-left .pb-num {
      position: absolute;
      bottom: clamp(16px,2.5vw,28px);
      left: clamp(16px,2.5vw,28px);
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7px,.8vw,9px);
      font-weight: 200; letter-spacing: .3em;
      color: rgba(255,255,255,.25); z-index: 3;
    }

    .pb-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255,255,255,0.04);
    }
    .pb-right-top {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      clip-path: inset(0 0 100% 0);
    }
    .pb-right-top img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.1);
      transition: filter 1s ease, transform 1s ease;
    }
   

    /* meta panel inside right-bottom */
    .pb-right-meta {
      padding: clamp(24px,4vw,50px) clamp(20px,3.5vw,44px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      opacity: 0; transform: translateY(20px);
    }
    .pb-right-meta .pm-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6px,.8vw,8px);
      font-weight: 300; letter-spacing: .4em;
      text-transform: uppercase; color: var(--gold); opacity: .8;
    }
    .pb-right-meta .pm-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px,3vw,40px);
      font-weight: 300; font-style: italic;
      color: var(--cream); line-height: 1;
    }
    .pb-right-meta .pm-year {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6px,.8vw,8px);
      font-weight: 200; letter-spacing: .35em;
      color: var(--muted);
    }

    /* ── PIECE C: WIDE STATEMENT STRIP ───────────── */
    .piece-c {
      position: relative;
      height: clamp(1000px,55vh,680px);
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .piece-c img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.1) translateX(-3%);
      transition: filter 1.1s ease;
      will-change: transform;
    }

    /* diagonal text treatment */
    .piece-c .pc-over {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center;
      padding: 0 clamp(24px,7vw,100px);
      background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, transparent 60%);
      opacity: 0;
    }
    .piece-c .pc-inner { max-width: 560px; }
    .piece-c .pc-eyebrow {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7px,.9vw,9px);
      font-weight: 300; letter-spacing: .44em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 20px;
    }
    .piece-c .pc-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(34px,5.5vw,78px);
      font-weight: 300; font-style: italic;
      color: transparent;
      -webkit-text-stroke: .55px rgba(240,236,228,.7);
      line-height: .9; letter-spacing: -.015em;
      margin-bottom: 28px;
    }
    .piece-c .pc-line {
      width: 0; height: 1px;
      background: var(--accent); opacity: .5;
    }

    /* ── PIECE D: THREE TALL PANELS ──────────────── */
    .piece-d {
      display: flex;
      height: clamp(400px,65vh,750px);
      border-top: 1px solid rgba(255,255,255,0.04);
      gap: 0;
    }
    .pd-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255,255,255,0.04);
      clip-path: inset(0 0 100% 0);
      cursor: pointer;
    }
    .pd-panel:last-child { border-right: none; }
    .pd-panel img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.1);
      transition: filter 1s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
    }
    .pd-panel:hover img {
      transform: scale(1.0);
    }
    .pd-panel .pd-meta {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: clamp(30px,4vw,50px) clamp(16px,2.5vw,30px) clamp(18px,2.5vw,28px);
      background: linear-gradient(transparent, rgba(0,0,0,.75));
      transform: translateY(14px); opacity: 0;
      transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .5s ease;
    }
    .pd-panel:hover .pd-meta { transform: translateY(0); opacity: 1; }
    .pd-meta-num {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7px,.8vw,9px);
      font-weight: 200; letter-spacing: .3em;
      color: var(--gold); margin-bottom: 8px;
    }
    .pd-meta-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px,2.5vw,32px);
      font-weight: 300; font-style: italic;
      color: var(--cream); line-height: 1;
    }
    .pd-meta-cat {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6px,.75vw,8px);
      font-weight: 200; letter-spacing: .35em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
      margin-top: 6px;
    }

    /* ── PIECE E: CLOSING FULLSCREEN ─────────────── */
    .piece-e {
      position: relative;
      height: clamp(500px,90vh,1000px);
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .piece-e img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.15);
      will-change: transform;
    }
    .piece-e .pe-center {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; opacity: 0;
    }
    .pe-tag {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(7px,.9vw,9px);
      font-weight: 300; letter-spacing: .44em;
      text-transform: uppercase; color: var(--gold);
    }
    .pe-big {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px,8vw,120px);
      font-weight: 300; font-style: italic;
      color: transparent;
      -webkit-text-stroke: .6px rgba(240,236,228,.6);
      letter-spacing: -.02em; line-height: .85;
      text-align: center;
    }
    .pe-rule {
      width: 1px; height: 0;
      background: rgba(255,255,255,.15);
    }

    /* ── FOOTER BAR ───────────────────────────────── */
    .sh-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: clamp(24px,4vw,50px) clamp(24px,6vw,80px);
      border-top: 1px solid rgba(255,255,255,0.05);
      opacity: 0;
    }
    .sh-footer span {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6px,.8vw,8px);
      font-weight: 200; letter-spacing: .38em;
      text-transform: uppercase; color: var(--muted);
    }
    .sh-footer-line {
      flex: 1; height: 1px;
      background: rgba(255,255,255,.04); margin: 0 30px;
    }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 768px) {
      .piece-b { flex-direction: column; height: auto; }
      .pb-left { flex: 0 0 auto; width: 100%; height: 55vw; clip-path: inset(0 0 100% 0); }
      .pb-right { border-left: none; border-top: 1px solid rgba(255,255,255,.04); }
      .pb-right-top { height: 48vw; }
      .pb-right-meta { padding: 24px; }
      .piece-d { height: auto; }
      .pd-panel { height: 56vw; flex: 0 0 100%; width: 100%; clip-path: inset(0 0 100% 0); border-right: none; border-bottom: 1px solid rgba(255,255,255,.04); }
      .piece-d { flex-direction: column; }
      .pd-panel .pd-meta { opacity: 1; transform: none; }
      body { cursor: auto; }
      #cursor { display: none; }
      .sh-head { flex-direction: column; align-items: flex-start; gap: 16px; }
    }

    @media (max-width: 480px) {
      .piece-a { height: 80vh; }
      .piece-c { height: 55vw; min-height: 260px; }
      .piece-e { height: 75vh; }
      .pe-big { font-size: clamp(36px,10vw,60px); }
      .sh-head { padding: 50px 20px 40px; }
    }
  </style>
</head>
<body>

<div class="grain"></div>
<div id="cursor"></div>

<section id="showcase">

  <!-- HEAD -->
  <div class="sh-head">
    <div class="sh-label" id="shLabel">Portfolio</div>
    <div class="sh-title" id="shTitle">Selected<br>Work</div>
    <div class="sh-count" id="shCount"></div>
  </div>

  <!-- MARQUEE -->
 

  <!-- A: FULLSCREEN PARALLAX -->
  <div class="piece-a" id="pieceA">
    <div class="pa-clip" id="paClip">
      <div class="pa-img" id="paImg">
        <img src="./images/hero2.png" alt="Vast Wilderness"/>
      </div>
    </div>
    
  </div>

  <!-- B: SPLIT PANELS -->
  <div class="piece-b">
    <div class="pb-left" id="pbLeft">
      <img src="./images/seeing1.png" alt="Solitude"/>
      <div class="pb-num">02</div>
    </div>
    <div class="pb-right">
      <div class="pb-right-top" id="pbRTop">
        <img src="./images/hero1.png" alt="City Fog"/>
      </div>
     
    </div>
  </div>

  <!-- C: WIDE STATEMENT -->
  <div class="piece-c" id="pieceC">
    <img src="./images/worklast.png" alt="First Light" id="pCImg"/>
    <div class="pc-over" id="pcOver">
     
    </div>
  </div>

  <!-- D: THREE TALL PANELS -->
  <div class="piece-d">
    <div class="pd-panel" id="pdP1">
      <img src="./images/random1.png" alt="Bloom"/>
     
    </div>
    <div class="pd-panel" id="pdP2">
      <img src="./images/random2.png" alt="Still Lake"/>
     
    </div>
    <div class="pd-panel" id="pdP3">
      <img src="./images/hero3.png" alt="Horizon"/>
     
    </div>
  </div>

  <!-- E: CLOSING FULLSCREEN -->
  <div class="piece-e" id="pieceE">
    <img src="./images/workcenter.png" alt="Wings" id="peImg"/>
   
  </div>

 

</section>

<script>
  gsap.registerPlugin(ScrollTrigger);

  /* ── CURSOR ── */
  const cur = document.getElementById('cursor');
  let cx = 0, cy = 0, tx = 0, ty = 0;
  document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function loop() {
    cx += (tx - cx) * .14; cy += (ty - cy) * .14;
    cur.style.left = cx + 'px'; cur.style.top = cy + 'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('.piece-a,.piece-b,.piece-c,.pd-panel,.piece-e').forEach(el => {
    el.addEventListener('mouseenter', () => cur.classList.add('big'));
    el.addEventListener('mouseleave', () => cur.classList.remove('big'));
  });

  /* ── HEAD ENTRANCE ── */
  const headTl = gsap.timeline({ delay: .15 });
  headTl
    .to('#shLabel',  { opacity:1, y:0, duration:1,   ease:'expo.out' })
    .to('#shTitle',  { opacity:1, y:0, duration:1.2, ease:'expo.out' }, .15)
    .to('#shCount',  { opacity:1,      duration:.9,  ease:'expo.out' }, .4)
    .to('#marqueeWrap', { opacity:1,   duration:.8,  ease:'expo.out' }, .55);

  /* ── PIECE A — clip-wipe + parallax ── */
  gsap.to('#paClip', {
    clipPath: 'inset(0% 0 0 0)',
    duration: 1.6, ease: 'expo.inOut', delay: .5
  });
  gsap.to('#paText', { opacity:1, y:0, duration:1.1, ease:'expo.out', delay:1.2 });
  gsap.to('#paYear', { opacity:1,      duration:.9,  ease:'expo.out', delay:1.4 });

  // parallax scroll on piece A image
  gsap.to('#paImg', {
    yPercent: 22,
    ease: 'none',
    scrollTrigger: {
      trigger: '#pieceA',
      start: 'top top',
      end: 'bottom top',
      scrub: 1.4
    }
  });

  /* ── PIECE B ── */
  ScrollTrigger.create({
    trigger: '.piece-b',
    start: 'top 80%',
    onEnter: () => {
      gsap.to('#pbLeft',  { clipPath:'inset(0 0% 0 0)', duration:1.4, ease:'expo.inOut' });
      gsap.to('#pbRTop',  { clipPath:'inset(0 0 0% 0)', duration:1.4, ease:'expo.inOut', delay:.18 });
      gsap.to('#pbMeta',  { opacity:1, y:0, duration:1, ease:'expo.out', delay:.6 });
    }
  });

  /* ── PIECE C — parallax + overlay ── */
  gsap.to('#pCImg', {
    yPercent: 16,
    ease: 'none',
    scrollTrigger: {
      trigger: '#pieceC',
      start: 'top bottom',
      end: 'bottom top',
      scrub: 1.6
    }
  });
  ScrollTrigger.create({
    trigger: '#pieceC',
    start: 'top 72%',
    onEnter: () => {
      gsap.to('#pcOver', { opacity:1, duration:1, ease:'expo.out' });
      gsap.to('#pcLine', { width:56, duration:1.2, ease:'expo.out', delay:.3 });
    }
  });

  /* ── PIECE D — three panels stagger ── */
  ScrollTrigger.create({
    trigger: '.piece-d',
    start: 'top 78%',
    onEnter: () => {
      ['#pdP1','#pdP2','#pdP3'].forEach((id, i) => {
        gsap.to(id, {
          clipPath: 'inset(0 0 0% 0)',
          duration: 1.4, ease: 'expo.inOut', delay: i * .14
        });
      });
    }
  });

  /* ── PIECE E — fullscreen closing ── */
  gsap.to('#peImg', {
    scale: 1,
    yPercent: -8,
    ease: 'none',
    scrollTrigger: {
      trigger: '#pieceE',
      start: 'top bottom',
      end: 'bottom top',
      scrub: 2
    }
  });
  ScrollTrigger.create({
    trigger: '#pieceE',
    start: 'top 70%',
    onEnter: () => {
      gsap.to('#peCenter', { opacity:1, duration:1.3, ease:'expo.out' });
      gsap.to('#peRule',   { height:60, duration:1.6, ease:'expo.out', delay:.4 });
    }
  });
 window.addEventListener("load", () => {

    // force proper heights
    document.body.style.height =
      document.documentElement.scrollHeight + "px";

    // refresh gsap
    ScrollTrigger.refresh();

  });
 
</script>

</body>
</html>
