<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Gallery - Brand Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #080808;
      --secondary: #1a1a1a;
      --accent: #fff;
      --muted: #8b8b8b;
      --gold: #d4af37;
      --line: #2a2a2a;
    }

  
        body{
  margin:0;
  padding:0;
 background: var(--primary);
      color: var(--accent);
  overflow-x:hidden;
  overflow-y:hidden;

  scrollbar-width:none;
  -ms-overflow-style:none;
  cursor: none;
}

/* Chrome Safari Edge */

html::-webkit-scrollbar,
body::-webkit-scrollbar{
 
  display:none;
}

    /* ============================================
       SECTION: HEADER / TITLE
       ============================================ */
    .gallery-header {
      text-align: center;
      padding: 30px 24px 20px;
      position: relative;
      overflow: hidden;
    }

    .gallery-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: floatGlow 8s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-30px); }
    }

    .gallery-header h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      animation: slideInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      animation-delay: 0.2s;
    }

    .gallery-header p {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      animation: slideInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      animation-delay: 0.4s;
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       SECTION: MAIN GALLERY CONTAINER
       ============================================ */
    #gallery-section {
      position: relative;
      padding: 40px 10px;
      
    background-color: var(--primary);
      overflow: hidden;
    }

    #gallery-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(90deg, transparent 0%, #080808 5%, transparent 10%, transparent 90%, #080808 95%, transparent 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* ============================================
       GALLERY GRID - MASONRY LAYOUT
       ============================================ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      grid-auto-rows: auto;
      gap: 10px;
      max-width: 1500px;
      margin: 0 auto;
      perspective: 1000px;
    }

    @media (min-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .gallery-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    /* ============================================
       GALLERY CARDS WITH VARIED HEIGHTS
       ============================================ */
    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 2px;
      aspect-ratio: auto;
      cursor: pointer;
      group: 'card';
      background: var(--secondary);
      opacity: 0;
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Varied card sizes */
    .gallery-card:nth-child(1) {
      grid-column: span 1;
      grid-row: span 2;
      animation-delay: 0.1s;
    }

    .gallery-card:nth-child(2) {
      grid-column: span 1;
      grid-row: span 1;
      animation-delay: 0.15s;
    }

    .gallery-card:nth-child(3) {
      grid-column: span 1;
      grid-row: span 1;
      animation-delay: 0.2s;
    }

    .gallery-card:nth-child(4) {
      grid-column: span 1;
      grid-row: span 2;
      animation-delay: 0.25s;
    }

    .gallery-card:nth-child(5) {
      grid-column: span 1;
      grid-row: span 1;
      animation-delay: 0.3s;
    }

    .gallery-card:nth-child(6) {
      grid-column: span 1;
      grid-row: span 1;
      animation-delay: 0.35s;
    }

    .gallery-card:nth-child(7) {
      grid-column: span 1;
      grid-row: span 2;
      animation-delay: 0.4s;
    }

    .gallery-card:nth-child(8) {
      grid-column: span 1;
      grid-row: span 1;
      animation-delay: 0.45s;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .gallery-card:hover {
      transform: translateY(-8px);
    }

    /* ============================================
       CARD IMAGE STYLING
       ============================================ */
    .card-image {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: saturate(0.7) contrast(1.1) brightness(0.85);
    }

    .gallery-card:hover .card-image img {
      transform: scale(1.08);
      filter: saturate(0.95) contrast(1.15) brightness(0.95);
    }

    /* ============================================
       CARD OVERLAY & METADATA
       ============================================ */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(0, 0, 0, 0) 50%,
        rgba(0, 0, 0, 0.8) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-card:hover .card-overlay {
      opacity: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      transform: translateY(10px);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-card:hover .card-title {
      transform: translateY(0);
    }

    .card-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: 0.1s;
    }

    .gallery-card:hover .card-meta {
      opacity: 1;
      transform: translateY(0);
    }

    .card-meta::before {
      content: '';
      width: 2px;
      height: 2px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* ============================================
       FLOATING ACTION INDICATOR
       ============================================ */
    .gallery-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      z-index: 5;
      animation: hintBounce 3s ease-in-out infinite;
    }

    @keyframes hintBounce {
      0%, 100% {
        opacity: 0.4;
        transform: translateX(-50%) translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateX(-50%) translateY(-8px);
      }
    }

    /* ============================================
       DIVIDER & ACCENT ELEMENTS
       ============================================ */
    .gallery-divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 40px auto;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .gallery-card:nth-child(1),
      .gallery-card:nth-child(4),
      .gallery-card:nth-child(7) {
        grid-column: span 1 !important;
        grid-row: span 1 !important;
      }

      .gallery-header h1 {
        font-size: 28px;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      #gallery-section {
        padding: 40px 12px;
      }

      .gallery-header {
        padding: 60px 16px 30px;
      }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  

  <!-- MAIN GALLERY SECTION -->
  <section id="gallery-section">
    <div class="gallery-grid" id="galleryGrid">
      <!-- Cards will be generated by JavaScript -->
    </div>
  
  </section>

  <script>
    // Gallery data with titles and metadata
    const galleryData = [
      { src: '../images/drag1.png', title: 'Vast Wilderness', category: 'Landscape', year: 2024 },
      { src: '../images/drag2.png', title: 'Bloom', category: 'Macro', year: 2024 },
      { src: '../images/drag3.png', title: 'City Fog', category: 'Urban', year: 2023 },
      { src: '../images/drag4.png', title: 'Wingspan', category: 'Nature', year: 2023 },
      { src: '../images/drag5.png', title: 'Still Lake', category: 'Landscape', year: 2023 },
      { src: '../images/drag6.png', title: 'Granite Peak', category: 'Mountain', year: 2022 },
      { src: '../images/drag7.png', title: 'Valley Floor', category: 'Aerial', year: 2022 },
      { src: '../images/drag8.png', title: 'Dusk Shore', category: 'Seascape', year: 2022 },
    ];

    // Render gallery cards
    const galleryGrid = document.getElementById('galleryGrid');
    galleryData.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.innerHTML = `
        <div class="card-image">
          <img src="${item.src}" alt="${item.title}" loading="lazy" />
        </div>
       
      `;
      galleryGrid.appendChild(card);
    });

    // Scroll-triggered animation for cards
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px',
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
        }
      });
    }, observerOptions);

    document.querySelectorAll('.gallery-card').forEach((card) => {
      observer.observe(card);
    });

    // Smooth scroll parallax effect
    let ticking = false;
    const applyParallax = () => {
      const cards = document.querySelectorAll('.gallery-card');
      const scrolled = window.scrollY;

      cards.forEach((card, index) => {
        const rect = card.getBoundingClientRect();
        const windowHeight = window.innerHeight;

        if (rect.top < windowHeight && rect.bottom > 0) {
          const yOffset = (rect.top / windowHeight) * 30;
          card.style.transform = `translateY(${yOffset}px)`;
        }
      });
    };

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(applyParallax);
        ticking = true;
      }
      ticking = false;
    });

    // Stagger animation on initial load
    window.addEventListener('load', () => {
      const cards = document.querySelectorAll('.gallery-card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.style.opacity = '1';
        }, index * 50);
      });
    });
  </script>
</body>
</html>
