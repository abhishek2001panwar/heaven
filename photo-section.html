<section id="showcase">

  <!-- HEAD -->
  <div class="sh-head">
    <div class="sh-label" id="shLabel">Portfolio</div>
    <div class="sh-title" id="shTitle">Selected<br>Work</div>
    <div class="sh-count" id="shCount"></div>
  </div>

  <!-- MARQUEE -->
 

  <!-- A: FULLSCREEN PARALLAX -->
  <div class="piece-a" id="pieceA">
    <div class="pa-clip" id="paClip">
      <div class="pa-img" id="paImg">
        <img src="/images/hero2.png" alt="Vast Wilderness"/>
      </div>
    </div>
    <div class="pa-text" id="paText">
      <div class="pt-cat">Landscape</div>
      <div class="pt-title">Vast<br>Wilderness</div>
    </div>
    <div class="pa-year" id="paYear">2024</div>
  </div>

  <!-- B: SPLIT PANELS -->
  <div class="piece-b">
    <div class="pb-left" id="pbLeft">
      <img src="/images/seeing1.png" alt="Solitude"/>
      <div class="pb-num">02</div>
    </div>
    <div class="pb-right">
      <div class="pb-right-top" id="pbRTop">
        <img src="/images/hero1.png" alt="City Fog"/>
      </div>
      <div class="pb-right-meta" id="pbMeta">
        <div class="pm-label">Urban · 2023</div>
        <div class="pm-title">City<br>Fog</div>
        <div class="pm-year">03</div>
      </div>
    </div>
  </div>

  <!-- C: WIDE STATEMENT -->
  <div class="piece-c" id="pieceC">
    <img src="/images/worklast.png" alt="First Light" id="pCImg"/>
    <div class="pc-over" id="pcOver">
      <div class="pc-inner">
        <div class="pc-eyebrow">Nature · 2022</div>
        <div class="pc-headline">First<br>Light</div>
        <div class="pc-line" id="pcLine"></div>
      </div>
    </div>
  </div>

  <!-- D: THREE TALL PANELS -->
  <div class="piece-d">
    <div class="pd-panel" id="pdP1">
      <img src="/images/random1.png" alt="Bloom"/>
      <div class="pd-meta">
        <div class="pd-meta-num">05</div>
        <div class="pd-meta-title">Bloom</div>
        <div class="pd-meta-cat">Macro · 2022</div>
      </div>
    </div>
    <div class="pd-panel" id="pdP2">
      <img src="/images/random2.png" alt="Still Lake"/>
      <div class="pd-meta">
        <div class="pd-meta-num">06</div>
        <div class="pd-meta-title">Still Lake</div>
        <div class="pd-meta-cat">Landscape · 2022</div>
      </div>
    </div>
    <div class="pd-panel" id="pdP3">
      <img src="/images/hero3.png" alt="Horizon"/>
      <div class="pd-meta">
        <div class="pd-meta-num">07</div>
        <div class="pd-meta-title">Horizon</div>
        <div class="pd-meta-cat">Seascape · 2023</div>
      </div>
    </div>
  </div>

  <!-- E: CLOSING FULLSCREEN -->
  <div class="piece-e" id="pieceE">
    <img src="./images/workcenter.png" alt="Wings" id="peImg"/>
    <div class="pe-center" id="peCenter">
      <div class="pe-tag">Wildlife · 2021</div>
      <div class="pe-big">Wing<br>span</div>
      <div class="pe-rule" id="peRule"></div>
      <div class="pe-tag">09</div>
    </div>
  </div>

 

</section>
